name: check

on:
  push:
  pull_request:

jobs:
  local-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint, tests, Slurm check, source check, dry-run
        run: make check PYTHON=python
