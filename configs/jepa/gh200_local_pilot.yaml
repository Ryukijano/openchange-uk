optimizer: {name: adamw, lr: 5.0e-4, lr_reference_batch: 1024, lr_scaling: none_debug, betas: [0.9, 0.95], eps: 1.0e-8, weight_decay: 0.05, weight_decay_scope: matrices_only, grad_clip_norm: 3.0}
schedule: {name: cosine, warmup_steps: 5, total_steps: 50, floor_ratio: 0.001}
gradient_accumulation: 1
precision: bf16
runtime: {cpu_threads: 4, max_wall_seconds: 1500, deterministic: false}
checkpoint: {every_steps: 25}
