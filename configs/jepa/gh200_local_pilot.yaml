schema_version: 1
status: local_pilot
synthetic_only: false
split: pilot
job: jepa-gh200-local-pilot
seed: 0
loss_reduction: mean_n_v_k
strata: [joint_clear, joint_occluded, s1_only, s2_only]
global_batch: 32
global_quotas: [8, 8, 8, 8]
stratum_weights: [0.25, 0.25, 0.25, 0.25]
sensors: {s1: [VV, VH], s2: [B01, B02, B03, B04, B05, B06, B07, B08, B8A, B09, B11, B12]}
normalization: manifest
patch_size: 16
global_views: 2
local_views: 6
global_crop_pixels: 224
local_crop_pixels: 96
global_crop_scale: [0.4, 1.0]
local_crop_scale: [0.05, 0.4]
crop_log_aspect: [-0.2876821, 0.2876821]
local_sensor_probs: {s1: 0.4, s2: 0.4, both: 0.2}
s2_gain_jitter: 0.0
global_token_drop: 0.9
local_token_drop: 0.5
token_keep_rounding: half_up_exact
